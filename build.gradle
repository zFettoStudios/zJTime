plugins {
    id "java"
    id "java-library"
    id "maven-publish"
    id "com.gradleup.shadow" version "$gradle_shadow_version"
    id "xyz.wagyourtail.jvmdowngrader" version "$jmvdowngrader_version"
    id "io.freefair.lombok" version "$lombok_plugin_version"
}

group = project_group
version = project_version

java {
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.projectlombok:lombok:$lombok_version"
    annotationProcessor "org.projectlombok:lombok:$lombok_version"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption("Xdoclint:none", "-quiet")
    options.addStringOption("encoding", "UTF-8")
    options.addStringOption("charSet", "UTF-8")
}


tasks.named("shadowJar", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveFileName = "$project_name-${project_version}.jar"

    from(rootProject.file("LICENSE")) {
        into("/")
    }

    outputs.cacheIf { true }
    minimize()
}

tasks.named("downgradeJar", xyz.wagyourtail.jvmdg.gradle.task.DowngradeJar) {
    dependsOn tasks.named("jar")
    dependsOn tasks.named("shadowJar")

    inputFile = tasks.named("shadowJar").flatMap { it.archiveFile }
    downgradeTo = JavaVersion.VERSION_21

    archiveFileName = "$project_name-${project_version}.jar"
    destinationDirectory = layout.buildDirectory.dir("libs")
}

tasks.named("jar") {
    mustRunAfter(tasks.named("shadowJar"))
}

tasks.named("build") {
    dependsOn tasks.named("downgradeJar")
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact(tasks.named("downgradeJar").flatMap { it.archiveFile }) {
                classifier = ""
            }

            artifact(tasks.named("sourcesJar"))
            artifact(tasks.named("javadocJar"))

            versionMapping {
                usage('java-api') { fromResolutionOf('runtimeClasspath') }
                usage('java-runtime') { fromResolutionOf('runtimeClasspath') }
            }
        }
    }
}